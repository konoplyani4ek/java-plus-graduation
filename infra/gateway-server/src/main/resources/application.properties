spring.application.name=gateway-server
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.config.import=optional:configserver:

spring.cloud.gateway.discovery.locator.enabled=false

# /admin/users/** -> user-service (????????? CRUD ?????????????)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/users/**,/admin/users

# /users/{userId}/requests/** -> request-service (?????? ?? ???????)
spring.cloud.gateway.routes[1].id=request-service
spring.cloud.gateway.routes[1].uri=lb://request-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/*/requests/**,/users/*/requests

# ???????: ????????? /events/**, ???????????????? /admin/events/**, ????????? /users/{userId}/events/**
spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=lb://event-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/events/**,/events,/admin/events/**,/users/*/events/**

# ????????? -> category-service
spring.cloud.gateway.routes[3].id=category-service
spring.cloud.gateway.routes[3].uri=lb://category-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/categories/**,/categories,/admin/categories/**

# ????? -> location-service
spring.cloud.gateway.routes[4].id=location-service
spring.cloud.gateway.routes[4].uri=lb://location-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/places/**,/places,/admin/places/**

# ???????? -> compilation-service
spring.cloud.gateway.routes[5].id=compilation-service
spring.cloud.gateway.routes[5].uri=lb://compilation-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/compilations/**,/compilations,/admin/compilations/**

eureka.client.registry-fetch-interval-seconds=5
management.endpoints.web.exposure.include=gateway,health
management.endpoint.gateway.access=unrestricted
