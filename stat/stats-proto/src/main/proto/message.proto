syntax = "proto3";

package stats.message;

option java_package = "ewm.stats.proto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// ---------- Действия пользователей (Collector) ----------

enum ActionTypeProto {
  ACTION_VIEW = 0;     // просмотр страницы мероприятия
  ACTION_REGISTER = 1; // заявка на участие в мероприятии
  ACTION_LIKE = 2;     // положительная оценка/лайк мероприятию
}

message UserActionProto {
  int64 user_id = 1;
  int64 event_id = 2;
  ActionTypeProto action_type = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// ---------- Запросы и ответы Analyzer ----------

message UserPredictionsRequestProto {
  int64 user_id = 1;
  int32 max_results = 2;
}

message SimilarEventsRequestProto {
  int64 event_id = 1;
  int64 user_id = 2;
  int32 max_results = 3;
}

message InteractionsCountRequestProto {
  repeated int64 event_id = 1;
}

message RecommendedEventProto {
  int64 event_id = 1;
  // в зависимости от вызванного метода: предсказанная оценка,
  // коэффициент сходства или сумма весов действий
  double score = 2;
}
