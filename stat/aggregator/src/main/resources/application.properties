spring.application.name=aggregator-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

aggregator.kafka.topic.user-actions=stats.user-actions.v1
aggregator.kafka.topic.events-similarity=stats.events-similarity.v1

spring.kafka.consumer.group-id=aggregator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=ru.practicum.ewm.stats.avro.serializer.UserActionDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=ru.practicum.ewm.stats.avro.serializer.EventSimilaritySerializer
spring.kafka.producer.acks=all

aggregator.weights.view=0.4
aggregator.weights.register=0.8
aggregator.weights.like=1.0

spring.config.import=optional:configserver:
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5